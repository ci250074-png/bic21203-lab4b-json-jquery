<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 4b - Q3: jQuery DOM & Events</title>
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
  <style>
    body {
      background-color: #0d0d0d;
      color: #f5f5f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background-color: #161414;
      border: 2px solid #800020;
      box-shadow: 0 0 20px rgba(128, 0, 32, 0.4);
      border-radius: 12px;
      padding: 32px 40px;
      max-width: 480px;
      width: 90%;
      text-align: center;
    }
    h2 {
      color: #e05370;
      margin-top: 0;
      margin-bottom: 8px;
    }
    .instruction {
      color: #b0a8a8;
      font-size: 0.92rem;
      margin-bottom: 24px;
    }
    #myElement {
      font-size: 1.15rem;
      font-weight: bold;
      margin-bottom: 16px;
      color: #ffffff;
    }
    #myDIV {
      border-radius: 8px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }
    .myStyle {
        background-color: coral;
        padding: 10px 16px;
        color: #0d0d0d;
        font-weight: bold;
        border: 2px solid #800020;
        }
    #myButton {
      background-color: #800020;
      color: #ffffff;
      border: 1px solid #e05370;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    #myButton:hover {
      background-color: #a30029;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>jQuery DOM & Event Demo</h2>
    <p class="instruction">Click the button below to trigger the jQuery click event.</p>

    <div id="myElement">Original Text</div>
    <div id="myDIV"><p>I am a myDIV.</p></div>
    <button id="myButton">Click me</button>
  </div>

  <script>
    $(document).ready(function () {
      $("#myElement").text("Modified Text");
      $("#myDIV").addClass("myStyle");
      $("#myButton").on("click", function () {
        alert("Button clicked!");
      });
    });
  </script>
</body>
</html>
