<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 4b - Q2: JSON Book Reader</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #f5f5f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background-color: #161414;
      border: 2px solid #800020;
      box-shadow: 0 0 20px rgba(128, 0, 32, 0.4);
      border-radius: 12px;
      padding: 32px 40px;
      max-width: 520px;
      width: 90%;
    }
    h2 {
      color: #e05370;
      text-align: center;
      margin-top: 0;
      margin-bottom: 8px;
    }
    .instruction {
      color: #b0a8a8;
      text-align: center;
      font-size: 0.92rem;
      margin-bottom: 24px;
    }
    .output-group {
      background-color: #1f1c1c;
      border-left: 4px solid #800020;
      padding: 12px 16px;
      margin-bottom: 14px;
      border-radius: 6px;
    }
    .label {
      font-size: 0.85rem;
      color: #e05370;
      font-weight: bold;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .value {
      font-size: 1.05rem;
      color: #ffffff;
    }
    ul {
      margin: 6px 0 0 18px;
      padding: 0;
    }
    li {
      margin-bottom: 4px;
    }
    .status-ok {
      color: #4ade80;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 16px;
    }
    .error-msg {
      color: #ff6b6b;
      background-color: rgba(255, 107, 107, 0.1);
      border: 1px solid #ff6b6b;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>JSON Book Library</h2>
    <p class="instruction">Fetched dynamically from <code>books.json</code> via local server.</p>

    <div id="content">
      <div class="output-group">
        <div class="label">(a) Title of First Book</div>
        <div class="value" id="firstTitle">Loading...</div>
      </div>

      <div class="output-group">
        <div class="label">(b) Author of Second Book</div>
        <div class="value" id="secondAuthor">Loading...</div>
      </div>

      <div class="output-group">
        <div class="label">(c) Genres Grouped by Book Title</div>
        <ul id="genresList"></ul>
      </div>

      <div class="status-ok" id="parseStatus"></div>
    </div>

    <div id="errorBox" class="error-msg" style="display: none;"></div>
  </div>

  <script>
    async function loadBooks() {
      const contentBox = document.getElementById("content");
      const errorBox = document.getElementById("errorBox");

      try {
        const response = await fetch("books.json");
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const data = await response.json();

        if (!data.books || data.books.length < 2) {
          throw new Error("Invalid JSON structure: Missing required book entries.");
        }

        document.getElementById("firstTitle").textContent = data.books[0].title;
        document.getElementById("secondAuthor").textContent = data.books[1].author;

        const genresList = document.getElementById("genresList");
        genresList.textContent = "";

        data.books.forEach((book) => {
          const li = document.createElement("li");
          li.textContent = `${book.title} — ${book.genres.join(", ")}`;
          genresList.appendChild(li);
        });

        document.getElementById("parseStatus").textContent =
          "✔ books.json fetched and parsed successfully.";
      } catch (error) {
        contentBox.style.display = "none";
        errorBox.style.display = "block";
        errorBox.textContent = `Unable to load book data: ${error.message}`;
      }
    }

    loadBooks();
  </script>
</body>
</html>
